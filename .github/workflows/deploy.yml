name: C++ & Cloud ETL Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
permissions:
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Syntax
        run: |
          python3 -m compileall .

      - name: Verify C++ Syntax
        run: |
          echo "Scanning and compiling C++ files..."
          for file in $(find . -name "*.cpp"); do
            echo "Compiling $file..."
            g++ -std=c++20 -c "$file" -o /dev/null
          done
          echo "All C++ files built successfully!"
